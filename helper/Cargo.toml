[package]
name = "xreal-webxr"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local XREAL orientation and stereo bridge for WebXR"

[dependencies]
ar-drivers = { path = "../vendor/ar-drivers", default-features = false, features = ["nreal", "rusb"] }
nalgebra = "0.32.6"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
