<!doctype html>
<html>
  <meta charset="utf-8" /><title>XREAL Stereo Test</title
  ><style>
    body {
      background: #141c24;
      color: white;
      font: 18px system-ui;
    }
    button {
      font: inherit;
      padding: 15px;
      cursor: pointer;
      border: 2px solid #7699bd;
      border-radius: 8px;
      background: #304862;
      color: white;
      box-shadow: 0 3px 0 #080d13;
    }
    button:hover {
      background: #476788;
    }
    button:active {
      transform: translateY(3px);
      box-shadow: inset 0 2px 4px #0008;
    }
    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }
    #result {
      padding: 12px;
      border-left: 4px solid #80c5ff;
    }
    #result[data-error="true"] {
      border-color: #ff8d80;
      color: #ffbdb5;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
  <h1>Stereo + head tracking test</h1>
  <p>
    Connect in the toolbar first. The left eye is red; the right eye is blue.
    The white world marker should move opposite your head turn.
  </p>
  <p>
    <a href="/scene" style="color: #a0d8ff"
      >Try Orbit Room — full Three.js scene</a
    >
  </p>
  <button id="enter">Enter VR</button>
  <p id="result" role="status" aria-live="polite">
    Ready — Connect in the bottom toolbar, then press Enter VR.
  </p>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.querySelector("#c");
    const gl = canvas.getContext("webgl", { xrCompatible: true });
    const enter = document.querySelector("#enter");
    const result = document.querySelector("#result");
    enter.onclick = async () => {
      if (enter.disabled) return;
      enter.disabled = true;
      enter.textContent = "Starting VR…";
      result.dataset.error = "false";
      result.textContent = "Starting VR — checking WebGL…";
      const waiting = setTimeout(() => {
        result.textContent =
          "Still waiting for VR startup. Reload the extension and page if this continues.";
      }, 4000);
      let session;
      try {
        if (!gl)
          throw new Error(
            "WebGL is unavailable. Check Chrome graphics acceleration.",
          );
        if (!navigator.xr || !gl.makeXRCompatible)
          throw new Error(
            "WebXR bridge is unavailable. Reload the extension and this page.",
          );
        await gl.makeXRCompatible();
        result.textContent = "Starting VR — requesting a tracked session…";
        session = await navigator.xr.requestSession("immersive-vr", {
          requiredFeatures: ["local"],
        });
        const layer = new XRWebGLLayer(session, gl);
        session.updateRenderState({ baseLayer: layer });
        const ref = await session.requestReferenceSpace("local");
        result.textContent =
          "VR session started — waiting for the first frame…";
        enter.textContent = "VR running";
        window.xrTest = { frames: 0, views: 0, eyes: [], quaternion: null };
        function frame(t, f) {
          session.requestAnimationFrame(frame);
          const pose = f.getViewerPose(ref);
          if (!pose) return;
          gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer);
          gl.enable(gl.SCISSOR_TEST);
          window.xrTest.frames++;
          if (window.xrTest.frames === 1) {
            clearTimeout(waiting);
            result.textContent =
              "VR running — turn your head to move the white marker.";
          }
          window.xrTest.views = pose.views.length;
          window.xrTest.eyes = pose.views.map((v) => v.eye);
          window.xrTest.quaternion = [
            pose.transform.orientation.x,
            pose.transform.orientation.y,
            pose.transform.orientation.z,
            pose.transform.orientation.w,
          ];
          for (const view of pose.views) {
            const v = layer.getViewport(view);
            gl.viewport(v.x, v.y, v.width, v.height);
            gl.scissor(v.x, v.y, v.width, v.height);
            gl.clearColor(
              view.eye === "left" ? 0.25 : 0.03,
              0.04,
              view.eye === "right" ? 0.25 : 0.03,
              1,
            );
            gl.clear(gl.COLOR_BUFFER_BIT);
            const m = view.transform.inverse.matrix,
              p = view.projectionMatrix;
            const x = m[8] * -3 + m[12],
              y = m[9] * -3 + m[13],
              z = m[10] * -3 + m[14];
            if (z < 0) {
              const sx = v.x + v.width * (0.5 + (p[0] * x) / -z / 2),
                sy = v.y + v.height * (0.5 + (p[5] * y) / -z / 2);
              const size = Math.min(v.width, v.height) * 0.04;
              gl.scissor(
                Math.round(sx - size / 2),
                Math.round(sy - size / 2),
                Math.round(size),
                Math.round(size),
              );
              gl.clearColor(1, 1, 1, 1);
              gl.clear(gl.COLOR_BUFFER_BIT);
            }
          }
          gl.disable(gl.SCISSOR_TEST);
        }
        session.requestAnimationFrame(frame);
        session.addEventListener("end", () => {
          clearTimeout(waiting);
          result.textContent = "VR ended — you can enter again.";
          enter.textContent = "Enter VR";
          enter.disabled = false;
        });
      } catch (e) {
        clearTimeout(waiting);
        if (session) await session.end().catch(() => {});
        result.dataset.error = "true";
        result.textContent = "Could not start VR: " + e.message;
        enter.textContent = "Try Enter VR again";
        enter.disabled = false;
      }
    };
  </script>
</html>
